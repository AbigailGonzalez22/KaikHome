name: Deploy

# Builds the static site and uploads dist/ by FTP.
# Secrets (GitHub > Settings > Secrets and variables > Actions):
#   FTP_HOST, FTP_USER, FTP_PASS
#   FTP_SERVER_DIR  e.g. /nuevo.kaikhome.com/ while testing, /public_html/ for production (trailing slash required)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload dist/ by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Never touch the SMTP credentials that live only on the server.
          exclude: |
            **/config/config.php
