<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Monografía</title>
<style>
:root{--paper:#f2f2ef;--ink:#141615;--green:#558f6e;--gray:#8d918c}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Archivo","Helvetica Neue",Arial,sans-serif;background:var(--paper);color:var(--ink);display:grid;grid-template-columns:960px 1fr}
.plate{background:url(../../../img/hero-mentrida.jpg) center/cover;position:relative}
.plate small{position:absolute;left:24px;bottom:20px;color:#fff;font-size:12px;letter-spacing:.12em}
aside{padding:32px 48px;display:grid;grid-template-rows:auto 1fr auto auto;gap:24px;border-left:1px solid var(--ink)}
aside img{height:30px}
.idx{font-size:13px;letter-spacing:.14em;color:var(--gray);font-weight:700}
h1{font-size:58px;line-height:.95;font-weight:800;letter-spacing:-.02em;margin-top:18px}
dl{display:grid;grid-template-columns:1fr auto;border-top:1px solid var(--ink)}
dt,dd{padding:12px 0;border-bottom:1px solid var(--ink)}dt{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--gray);font-weight:700}
dd{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:0}.cta span{padding:18px;text-align:center;font-weight:800}
.cta span:first-child{background:var(--green);color:#fff}.cta span:last-child{border:1px solid var(--ink)}
svg{width:100%;height:120px}
</style></head><body>
<div class="plate"><small>LÁMINA 02 · RENDER · VISTA RESIDENCIAL MÉNTRIDA</small></div>
<aside><img src="../../../img/logo.png" alt="Kaik Home">
<div><p class="idx">02 / MÉNTRIDA, TOLEDO</p><h1>Vista Residencial Méntrida</h1>
<svg viewBox="0 0 400 120"><rect x="10" y="10" width="240" height="100" fill="none" stroke="#141615" stroke-width="2"/><line x1="120" y1="10" x2="120" y2="110" stroke="#141615"/><line x1="10" y1="118" x2="250" y2="118" stroke="#558f6e"/><text x="110" y="116" font-size="10" fill="#558f6e">204 m²</text></svg></div>
<dl><dt>Viviendas</dt><dd>24</dd><dt>Superficie</dt><dd>204 m²</dd><dt>Obra ejecutada</dt><dd>60 %</dd><dt>Entrega</dt><dd>1T 2027</dd></dl>
<div class="cta"><span>Reservar visita</span><span>Dossier</span></div></aside>
</body></html>
