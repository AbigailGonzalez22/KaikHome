<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Estándar del sector</title>
<style>
*{box-sizing:border-box;margin:0}body{width:1440px;height:900px;overflow:hidden;font-family:Georgia,serif;color:#1b1c1c;background:#fff}
.hero{position:relative;height:640px;background:url(../../../img/hero-toledo.jpg) center/cover;display:grid;place-items:center;text-align:center;color:#fff}
.hero::before{content:"";position:absolute;inset:0;background:#0006}
nav{position:absolute;top:0;left:0;right:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:28px 64px;font-family:Arial,sans-serif}
nav img{height:36px;filter:brightness(0) invert(1)}nav ul{display:flex;gap:36px;list-style:none;font-size:15px}
.c{position:relative;z-index:2}.c h1{font-size:72px;font-weight:400}.c p{font-family:Arial,sans-serif;font-size:19px;margin:18px 0 30px}
.c span{background:#558f6e;padding:16px 32px;font-family:Arial,sans-serif;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px 64px}
.cards div{height:220px;background:#eee center/cover}
</style></head><body>
<section class="hero"><nav><img src="../../../img/logo.png" alt=""><ul><li>Inicio</li><li>Promociones</li><li>Nosotros</li><li>Contacto</li></ul></nav>
<div class="c"><h1>Bienvenidos a Kaik Home</h1><p>Más de 10 años construyendo hogares en Toledo.</p><span>Ver promociones</span></div></section>
<div class="cards"><div style="background-image:url(../../../img/card-mentrida.jpg)"></div><div style="background-image:url(../../../img/card-bargas.jpg)"></div><div style="background-image:url(../../../img/card-proximamente-parla.jpg)"></div></div>
</body></html>
