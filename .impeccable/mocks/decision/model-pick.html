<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=1440">
<title>Cartel de obra</title>
<style>
:root{--green:#558f6e;--ink:#151816;--white:#fff;--yel:#f2c230}
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Archivo Narrow","Arial Narrow",Arial,sans-serif;background:var(--ink);color:var(--ink)}
.photo{position:absolute;inset:0;background:url(../../../img/hero-mentrida.jpg) center/cover}
nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px 48px;background:var(--white)}
nav img{height:34px}nav ul{display:flex;gap:36px;list-style:none;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.06em}
.sign{position:absolute;right:64px;top:130px;width:640px;background:var(--white);border:6px solid var(--green)}
.sign header{background:var(--green);color:#fff;padding:22px 28px}
.sign header p{font-size:15px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.sign h1{font-size:56px;line-height:1;font-weight:800;text-transform:uppercase}
table{width:100%;border-collapse:collapse;font-size:20px}
td{border-bottom:2px solid var(--ink);padding:14px 28px}td:first-child{width:46%;text-transform:uppercase;font-size:14px;letter-spacing:.1em;font-weight:700;border-right:2px solid var(--ink)}
td b{font-size:30px}
.act{display:grid;grid-template-columns:1fr 1fr}
.act span{padding:22px;text-align:center;font-weight:800;font-size:18px;text-transform:uppercase;letter-spacing:.06em}
.act span:first-child{background:var(--ink);color:#fff}.act span:last-child{background:var(--yel)}
.tag{position:absolute;left:64px;bottom:64px;background:var(--yel);padding:14px 22px;font-weight:800;font-size:20px;text-transform:uppercase}
</style></head><body>
<div class="photo"></div>
<nav><img src="../../../img/logo.png" alt="Kaik Home"><ul><li>Promociones</li><li>Próximamente</li><li>Vender</li><li>Contacto</li></ul></nav>
<div class="sign"><header><p>Obra de nueva construcción</p><h1>Vista Residencial Méntrida</h1></header>
<table><tr><td>Promotor</td><td><b>Kaik Home</b></td></tr><tr><td>Constructor</td><td><b>Kaik Home</b></td></tr><tr><td>Viviendas</td><td><b>24</b> de dos plantas</td></tr><tr><td>Obra ejecutada</td><td><b>60 %</b></td></tr><tr><td>Entrega prevista</td><td><b>1T 2027</b></td></tr></table>
<div class="act"><span>Reservar visita</span><span>Descargar dossier</span></div></div>
<div class="tag">● En ejecución</div>
</body></html>
